name: Validate support issues

on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - name: Check out issue validator
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate submitted form and close invalid issues
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { validateIssue } = require('./.github/scripts/validate-issue.cjs');
            const issue = context.payload.issue;
            const result = validateIssue(issue);
            if (result.valid) {
              core.info(`Issue #${issue.number} is valid.`);
              return;
            }

            const marker = '<!-- character-notes-support-validation -->';
            const body = [
              marker,
              'Thank you for contacting Character Notes. This issue does not match the required support form:',
              '',
              ...result.errors.map(error => `- ${error}`),
              '',
              'Please create a new issue using the appropriate form:',
              `https://github.com/${context.repo.owner}/${context.repo.repo}/issues/new/choose`,
              '',
              'For bug reports, include the technical log generated by Character Notes. Do not include private notes or chat data.',
              '',
              '_This issue was closed automatically by the support validator._'
            ].join('\n');

            // Avoid posting identical validation comments on repeated label edits.
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: issue.number, per_page: 100,
            });
            const duplicate = comments.some(comment =>
              comment.user?.type === 'Bot' && comment.body === body);
            if (!duplicate) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number, body,
              });
            }
            if (issue.state === 'open') {
              await github.rest.issues.update({
                ...context.repo, issue_number: issue.number, state: 'closed',
                state_reason: 'not_planned',
              });
            }
