name: Publish WoW Forever release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v1.4.0-beta
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: character-notes-release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
      RELEASE_PRODUCT: 'Character Notes & Alerts'
    steps:
      - name: Check out the release tag and history
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tag and build the ZIP and checksum
        id: package
        shell: bash
        run: |
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          test "$(git rev-parse HEAD)" = "$tag_commit"
          archive="dist/Character-Notes_${RELEASE_TAG}_Forever.zip"
          python3 scripts/build_release.py --tag "$RELEASE_TAG" --output "$archive"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Check Lua syntax and run mock tests
        shell: bash
        run: |
          shopt -s failglob
          luac5.1 -p CharNotes/*.lua
          for test in tests/*.lua; do lua5.1 "$test"; done

      - name: Generate player-facing release notes
        shell: bash
        run: |
          previous_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD^ 2>/dev/null || true)"
          revision_range="HEAD"
          if [[ -n "$previous_tag" ]]; then revision_range="refs/tags/${previous_tag}..HEAD"; fi

          python3 - "$revision_range" <<'PY' > dist/release-notes.md
          import os
          import re
          import subprocess
          import sys

          sections = {
              "feat": "New Features",
              "fix": "Bug Fixes",
              "perf": "Performance",
              "security": "Security",
              "revert": "Reverts",
          }
          grouped = {kind: [] for kind in sections}
          pattern = re.compile(r"^(feat|fix|perf|security|revert)(?:\(([^)]+)\))?(!)?:\s+(.+)$", re.I)
          subjects = subprocess.check_output(
              ["git", "log", "--no-merges", "--format=%s", sys.argv[1]], text=True
          ).splitlines()
          for subject in subjects:
              match = pattern.fullmatch(subject.strip())
              if not match:
                  continue
              kind, scope, breaking, description = match.groups()
              if scope:
                  description = f"**{scope}:** {description}"
              if breaking:
                  description = f"**BREAKING:** {description}"
              entries = grouped[kind.lower()]
              if description not in entries:
                  entries.append(description)

          print(f"# {os.environ['RELEASE_PRODUCT']} {os.environ['RELEASE_TAG']} — WoW Forever\n")
          for kind, heading in sections.items():
              if grouped[kind]:
                  print(f"## {heading}\n")
                  for item in grouped[kind]:
                      print(f"- {item}")
                  print()
          if not any(grouped.values()):
              print("No player-facing changes were recorded in Conventional Commit subjects.")
          PY

      - name: Publish the ZIP and checksum on GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          assets=("$RELEASE_ARCHIVE" "$RELEASE_ARCHIVE.sha256")
          if ! existing_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"; then
            prerelease=()
            if [[ "$RELEASE_TAG" == *-* ]]; then prerelease+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${assets[@]}" "${prerelease[@]}" \
              --verify-tag --title "$RELEASE_PRODUCT $RELEASE_TAG (WoW Forever)" \
              --notes-file dist/release-notes.md
            exit 0
          fi

          download_dir="$(mktemp -d)"
          trap 'rm -rf "$download_dir"' EXIT
          for asset in "${assets[@]}"; do
            name="${asset##*/}"
            if grep -Fxq -- "$name" <<< "$existing_assets"; then
              gh release download "$RELEASE_TAG" --pattern "$name" --dir "$download_dir"
              if ! cmp -s "$asset" "$download_dir/$name"; then
                echo "GitHub already has a different $name for $RELEASE_TAG. Verify the existing release assets before publishing." >&2
                exit 1
              fi
            else
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done

      - name: Upload the same ZIP and release notes to CurseForge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARCHIVE: ${{ steps.package.outputs.archive }}
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_GAME_VERSION_IDS: ${{ vars.CURSEFORGE_GAME_VERSION_IDS }}
        run: |
          bash scripts/publish_curseforge.sh "$RELEASE_TAG" "$RELEASE_ARCHIVE" \
            dist/release-notes.md "$RELEASE_PRODUCT $RELEASE_TAG (WoW Forever)"
