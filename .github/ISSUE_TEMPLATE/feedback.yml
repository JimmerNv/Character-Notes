name: Feedback
description: Share your experience or general feedback about Character Notes.
title: "[Feedback] "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for sharing your feedback! Issues are publicly visible.
        Please avoid character names, private notes, chat text and personal data.
  - type: input
    id: topic
    attributes:
      label: Feedback topic
      description: What is your feedback about?
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      description: Tell us what works well or could be improved.
    validations:
      required: true
  - type: input
    id: support-id
    attributes:
      label: Support ID
      description: Paste the anonymous support ID generated by Character Notes.
    validations:
      required: true
  - type: textarea
    id: addon-info
    attributes:
      label: Addon information (optional)
      description: Paste non-personal technical information if relevant.
      render: text
    validations:
      required: false
