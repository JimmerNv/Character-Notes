name: Feature Request
description: Suggest a new feature or improvement for Character Notes.
title: "[Feature] "
labels: ["feature-request"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your suggestion! Issues are publicly visible.
        Please do not include private notes, chat messages or other personal data.
  - type: input
    id: feature
    attributes:
      label: Feature summary
      description: Describe the requested feature in one sentence.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Problem or motivation
      description: Which use case or problem would this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how the feature should work.
    validations:
      required: true
  - type: input
    id: support-id
    attributes:
      label: Support ID
      description: Paste the anonymous support ID generated by Character Notes.
    validations:
      required: true
  - type: textarea
    id: addon-info
    attributes:
      label: Addon information (optional)
      description: Paste non-personal technical information if relevant.
      render: text
    validations:
      required: false
