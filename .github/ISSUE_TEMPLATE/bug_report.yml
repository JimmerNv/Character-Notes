name: Bug Report
description: Report an error or unexpected behavior in Character Notes.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Character Notes!
        GitHub issues are public. Please review the report and remove any
        character names, private notes, chat messages, or other personal data.
        The support ID is anonymous and is not your account or character ID.
  - type: input
    id: summary
    attributes:
      label: Bug summary
      description: Briefly describe what went wrong.
      placeholder: Notes window does not open after clicking the button
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Explain how to reproduce the issue.
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: input
    id: support-id
    attributes:
      label: Support ID
      description: Paste the anonymous support ID generated by Character Notes.
      placeholder: xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx
    validations:
      required: true
  - type: textarea
    id: technical-log
    attributes:
      label: Technical log
      description: |
        Paste the Character Notes support report, including addon version,
        WoW version/build, locale, error message and stack trace when available.
        Do not paste private notes, chat contents or talent builds.
      render: text
      placeholder: |
        Addon: Character Notes
        Addon version:
        WoW version / build:
        Locale:
        Error:
        Stacktrace:
    validations:
      required: true
